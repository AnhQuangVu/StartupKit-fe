name: CI

on:
  push:
    branches: [main]

jobs:

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy to production"